# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    # - cron:  '30 2 * * *'
     - cron:  '15 0 * * *'
# on: push
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
# Povolení zápisu pro token, aby mohl pushovat i do Wiki
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: check main repo content
      run: |
          ls -al
    # - name: Checkout wiki code
    #   uses: actions/checkout@v6
    #   with:
    #       repository: ${{github.repository}}.wiki    # specify the wiki repo name here.
    #       path: markdown
    - name: check wiki repo content
      run: |
          ls -al          
    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
    - name: Install dependencies and run script
      env:
        REPO_SECRET: ${{ secrets.KEYOSMBZ }}
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install requests
        python3 -m pip install cryptography
        python3 -m pip install -U gpx-converter
        python3 -m pip install pandas-geojson
        python3 -m pip install geopandas
        python3 -m pip install shapely

        # 1. Spuštění hlavního skriptu
        python cws_read.py

        # 2. Commit a push změn v hlavním repozitáři
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add -A
        git diff-index --quiet --cached HEAD || git commit -m 'Added my project bz1'
        git push origin main
        
        # 3. Stažení, úprava a push Wiki přes čistý git clone (bez akce checkout)
        git clone https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git wiki_folder
        
        # Zkopírujeme vygenerované soubory zpět do wiki, pokud je potřeba, 
        # nebo spoléháme na to, že wikipg.py upravil Home.md přímo uvnitř klonu.
        # (Pokud wikipg.py upravuje soubor Home.md v aktuálním adr., zkopírujeme ho do wiki_folder):
        if [ -f "Home.md" ]; then cp Home.md wiki_folder/; fi

        cd wiki_folder
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add -A
        git diff-index --quiet HEAD || git commit -m 'Automatic wiki update by script'
        git push origin master
        
